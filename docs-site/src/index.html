<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Learn infrastructure, backend engineering, AI, and AIOps in English, from essential terms to operational decisions."
    />
    <meta name="color-scheme" content="light dark" />
    <title>Study Gateway</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23326ce5'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Georgia' font-size='42' font-style='italic' font-weight='700' fill='white'%3Es%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./assets/styles.css" />
    <script type="module" src="./assets/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content" data-i18n>Skip to content</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="#" aria-label="Go to the documentation gateway" data-i18n-aria>
          <span class="brand-mark" aria-hidden="true">s</span>
          <span class="brand-copy">
            <strong>Study</strong>
            <small>gateway</small>
          </span>
        </a>
        <div class="header-actions">
          <label class="header-search" for="site-search">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18">
              <path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z" />
            </svg>
            <input id="site-search" type="search" placeholder="Search docs" aria-label="Search docs" data-i18n-placeholder data-i18n-aria autocomplete="off" />
            <kbd>/</kbd>
          </label>
          <div class="language-switch" role="group" aria-label="Display language" data-i18n-aria>
            <button type="button" data-language="ko" lang="ko" aria-pressed="false">한국어</button>
            <button type="button" data-language="en" lang="en" aria-pressed="true">EN</button>
          </div>
          <a class="github-link" data-repository-link href="#" aria-label="Open GitHub repository" data-i18n-aria>
            GitHub
          </a>
          <button class="theme-toggle" type="button" aria-label="Change color theme" title="Change color theme" data-i18n-aria data-i18n-title>
            <svg class="sun-icon" aria-hidden="true" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" />
            </svg>
            <svg class="moon-icon" aria-hidden="true" viewBox="0 0 24 24">
              <path d="M20.5 15.2A8.5 8.5 0 0 1 8.8 3.5 8.5 8.5 0 1 0 20.5 15.2Z" />
            </svg>
          </button>
        </div>
      </div>
    </header>
    <main id="main-content" tabindex="-1">
      <div class="loading-state" role="status">
        <span class="loading-mark">s</span>
        <p data-i18n>Loading learning paths.</p>
      </div>
    </main>
    <footer class="site-footer">
      <div>
        <span data-i18n>Official sources first. Examples make ideas concrete.</span>
        <span class="footer-separator" aria-hidden="true">/</span>
        <a data-repository-link href="#" data-i18n>View source on GitHub</a>
      </div>
    </footer>
    <dialog id="diagram-viewer" class="diagram-viewer" aria-labelledby="diagram-viewer-title">
      <div class="diagram-viewer-frame">
        <header class="diagram-viewer-header">
          <div>
            <p data-i18n>DIAGRAM VIEWER</p>
            <h2 id="diagram-viewer-title" data-i18n>Expanded diagram</h2>
          </div>
          <div class="diagram-viewer-actions" aria-label="Diagram zoom controls" data-i18n-aria>
            <button type="button" data-diagram-action="zoom-out" aria-label="Zoom out" data-i18n-aria>−</button>
            <output data-diagram-zoom aria-live="polite">100%</output>
            <button type="button" data-diagram-action="fit" data-i18n>Fit to screen</button>
            <button type="button" data-diagram-action="zoom-in" aria-label="Zoom in" data-i18n-aria>+</button>
            <button class="diagram-viewer-close" type="button" data-diagram-action="close" aria-label="Close" data-i18n-aria>×</button>
          </div>
        </header>
        <div class="diagram-viewer-canvas" data-diagram-canvas tabindex="0"></div>
        <p class="diagram-viewer-hint" data-i18n>Zoom in and scroll to explore the details. You can also zoom with Ctrl or ⌘ and the mouse wheel.</p>
      </div>
    </dialog>
    <noscript>This documentation gateway requires JavaScript.</noscript>
  </body>
</html>
