<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="공식 문서를 이해 순서로 재구성하고 예시와 다이어그램으로 확장하는 한국어 기술 학습 게이트웨이"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Study Gateway</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23326ce5'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Georgia' font-size='42' font-style='italic' font-weight='700' fill='white'%3Es%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./assets/styles.css" />
    <script type="module" src="./assets/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">본문으로 건너뛰기</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="#" aria-label="문서 게이트웨이로 이동">
          <span class="brand-mark" aria-hidden="true">s</span>
          <span class="brand-copy">
            <strong>Study</strong>
            <small>gateway</small>
          </span>
        </a>
        <div class="header-actions">
          <label class="header-search" for="site-search">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18">
              <path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z" />
            </svg>
            <input id="site-search" type="search" placeholder="문서 검색" autocomplete="off" />
            <kbd>/</kbd>
          </label>
          <a class="github-link" data-repository-link href="#" aria-label="GitHub 저장소 열기">
            GitHub
          </a>
          <button class="theme-toggle" type="button" aria-label="색상 테마 변경" title="색상 테마 변경">
            <svg class="sun-icon" aria-hidden="true" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" />
            </svg>
            <svg class="moon-icon" aria-hidden="true" viewBox="0 0 24 24">
              <path d="M20.5 15.2A8.5 8.5 0 0 1 8.8 3.5 8.5 8.5 0 1 0 20.5 15.2Z" />
            </svg>
          </button>
        </div>
      </div>
    </header>
    <main id="main-content" tabindex="-1">
      <div class="loading-state" role="status">
        <span class="loading-mark">s</span>
        <p>문서 지도를 불러오는 중입니다.</p>
      </div>
    </main>
    <footer class="site-footer">
      <div>
        <span>Official sources first. Examples make ideas concrete.</span>
        <span class="footer-separator" aria-hidden="true">/</span>
        <a data-repository-link href="#">GitHub에서 원본 보기</a>
      </div>
    </footer>
    <noscript>이 문서 게이트웨이는 JavaScript가 필요합니다.</noscript>
  </body>
</html>
