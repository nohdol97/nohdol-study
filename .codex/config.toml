# Project-local Codex settings load only after repository trust.
# Review and trust the exact hook definitions with /hooks.
project_doc_max_bytes = 65536

[features]
hooks = true

[[hooks.SessionStart]]
matcher = "startup|resume|clear|compact"

[[hooks.SessionStart.hooks]]
type = "command"
command = '"$(git rev-parse --show-toplevel)/.agents/hooks/study-session-start.sh"'
timeout = 10
statusMessage = "Loading study context"

# Keeps vault material out of an external notebook runtime. Registered here for
# parity with .claude/settings.json; whether this CLI honors PreToolUse has not
# been observed in a live Codex session, so treat Claude Code as the verified path.
[[hooks.PreToolUse]]
matcher = "mcp__colab-mcp__.*"

[[hooks.PreToolUse.hooks]]
type = "command"
command = '"$(git rev-parse --show-toplevel)/.agents/hooks/study-egress-guard.py"'
timeout = 10
statusMessage = "Checking the cell for vault material"

[[hooks.PostToolUse]]
matcher = "Write|Edit|MultiEdit|NotebookEdit"

[[hooks.PostToolUse.hooks]]
type = "command"
command = '"$(git rev-parse --show-toplevel)/.agents/hooks/study-note-check.py"'
timeout = 60
statusMessage = "Checking the note just written"

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = '"$(git rev-parse --show-toplevel)/.agents/hooks/study-wrapup.sh"'
timeout = 10
statusMessage = "Checking study note consistency"
